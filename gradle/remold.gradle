import org.gradle.jvm.toolchain.JavaLauncher

def remoldVersion = (findProperty('remold.version') ?: '0.2.6').toString()
def remoldEnabled = (findProperty('remold.enabled') ?: 'true').toString().toBoolean()
def isWindows = System.getProperty('os.name').toLowerCase().contains('win')

def agentJar = findProperty('remold.agentJar')
        ? file(findProperty('remold.agentJar'))
        : [file('libs/remold/remold-agent.jar'), file('libs/remold-agent.jar')].find { it.isFile() }

def forgePluginJar = findProperty('remold.forgePluginJar')
        ? file(findProperty('remold.forgePluginJar'))
        : [file('libs/remold/remold-plugin-forge.jar')].find { it.isFile() }

def buildDirFile = layout.buildDirectory.get().asFile
def watchDirs = [
        new File(buildDirFile, 'classes/java/main'),
        new File(buildDirFile, 'resources/main'),
]
watchDirs.each { it.mkdirs() }   
def watchArg = watchDirs.collect { it.absolutePath }.join(File.pathSeparator)

def jbrClean = { Object v ->
    def s = v?.toString()?.trim()
    if (s && s.length() >= 2) {
        def a = s.charAt(0)
        def b = s.charAt(s.length() - 1)
        if ((a == '"' && b == '"') || (a == '\'' && b == '\'')) {
            s = s.substring(1, s.length() - 1).trim()
        }
    }
    s ?: null
}

def jbrSource = null
def jbrHome = null
def explicitJbr = jbrClean(findProperty('remold.jbr'))
if (explicitJbr) {
    def normalized = explicitJbr.toLowerCase()
    if (normalized in ['none', 'off', 'false', '-']) {

    } else {
        jbrHome = explicitJbr
        jbrSource = 'remold.jbr'
    }
} else {
    [['JBR_HOME', jbrClean(System.getenv('JBR_HOME'))],
     ['REMOLD_JBR', jbrClean(System.getenv('REMOLD_JBR'))],
     ['jbr.home', jbrClean(findProperty('jbr.home'))]].each { entry ->
        if (jbrHome == null && entry[1]) {
            jbrHome = entry[1]
            jbrSource = entry[0]
        }
    }
}

def jbrJava = jbrHome ? new File(jbrHome, isWindows ? 'bin/java.exe' : 'bin/java') : null
def jbrOk = jbrJava != null && jbrJava.isFile()

def jbrScope = (findProperty('remold.jbr.scope') ?: 'all').toString().toLowerCase()
if (explicitJbr in ['none', 'off', 'false', '-']) {
    jbrScope = 'off'
}

def remoldJvmArgs = []
if (remoldEnabled && agentJar != null && agentJar.isFile()) {
    remoldJvmArgs << '-XX:+IgnoreUnrecognizedVMOptions'
    remoldJvmArgs << '-XX:+AllowEnhancedClassRedefinition'
    remoldJvmArgs << "-javaagent:${agentJar.absolutePath}=${watchArg}"
    remoldJvmArgs << '--add-exports=java.base/jdk.internal.misc=ALL-UNNAMED'
    remoldJvmArgs << '--add-exports=java.base/jdk.internal.reflect=ALL-UNNAMED'
    remoldJvmArgs << '--add-exports=java.base/jdk.internal.loader=ALL-UNNAMED'
    remoldJvmArgs << '--enable-native-access=ALL-UNNAMED'
    remoldJvmArgs << '-Djdk.attach.allowAttachSelf=true'

    if (forgePluginJar != null && forgePluginJar.isFile()) {
        remoldJvmArgs << '-Dremold.plugins=forge'
        remoldJvmArgs << "-Dremold.plugin.jars=${forgePluginJar.absolutePath}"
    }
    remoldJvmArgs << "-Dremold.build_mode=${findProperty('remold.buildMode') ?: 'auto'}"
    // 0.2.6 起 class 防抖默认 800ms、资源独立 250ms；只有显式设置 remold.fileShakeMs 才覆盖
    def fileShake = findProperty('remold.fileShakeMs')
    if (fileShake != null) {
        remoldJvmArgs << "-Dremold.file_shake_ms=${fileShake}"
    }
}

if (remoldEnabled && !remoldJvmArgs.isEmpty()) {
    neoForge.runs.configureEach { run ->
        jvmArguments.addAll(remoldJvmArgs)
    }
}

def remoldForceJbr = (findProperty('remold.forceJbr') ?: 'false').toString().toBoolean()
if ((remoldEnabled || remoldForceJbr) && jbrOk && jbrScope != 'off') {
    tasks.withType(JavaExec).configureEach { task ->
        if (task.name ==~ /run[A-Z].*/) {
            if (jbrScope == 'server' && task.name == 'runClient') {
                return
            }
            try {
                task.javaLauncher.set(null as JavaLauncher)
            } catch (Throwable ignored) {
            }
            task.executable = jbrJava.absolutePath
        }
    }
}

tasks.register('remoldInfo') {
    group = 'remold'
    description = '打印 Remold 热重载配置（agent / 插件 / 监控目录 / JBR）'
    doLast {
        println '[Remold] enabled        : ' + remoldEnabled
        println '[Remold] version        : ' + remoldVersion
        println '[Remold] agent jar      : ' + (agentJar?.absolutePath ?: '<未找到>')
        println '[Remold] forge plugin   : ' + (forgePluginJar?.absolutePath ?: '<未找到>')
        println '[Remold] watch dirs     : ' + watchArg
        println '[Remold] jbr home       : ' + (jbrHome ?: '<未指定>')
        println '[Remold] jbr source     : ' + (jbrSource ?: '<无>')
        println '[Remold] jbr scope      : ' + jbrScope
        println '[Remold] env JBR_HOME   : ' + (System.getenv('JBR_HOME') ?: '<守护进程里读不到>')
        println '[Remold] env REMOLD_JBR : ' + (System.getenv('REMOLD_JBR') ?: '<未设置>')
        println '[Remold] jbr java       : ' + (jbrOk ? jbrJava.absolutePath : '<未找到，将用 Gradle 当前 JVM，DCEVM 能力缺失>')
        println '[Remold] gradle daemon  : pid ' + ProcessHandle.current().pid() +
                '（环境变量在守护进程启动时就固定了；刚改过环境变量请先 gradlew --stop）'
        println '[Remold] jvm args       :'
        remoldJvmArgs.each { println '           ' + it }
    }
}

if (remoldEnabled) {
    if (agentJar == null || !agentJar.isFile()) {
        logger.warn("[Remold] 未找到 remold-agent.jar（期望 libs/remold/remold-agent.jar），本次不启用热重载。")
    } else if (!jbrOk) {
        logger.warn("[Remold] 未找到 JBR（-Premold.jbr / gradle.properties: remold.jbr / JBR_HOME / REMOLD_JBR / jbr.home）。" +
                '会用普通 HotSpot 运行：只能改方法体，加字段/方法会失败。')
        logger.warn('[Remold] 提示：Gradle 守护进程会缓存启动时的环境变量。如果你刚设过 JBR_HOME，' +
                '请先执行 `gradlew --stop` 再重试（或用 `gradlew remoldInfo` 看守护进程实际读到的值），' +
                '或者把 remold.jbr=<JBR目录> 写进 gradle.properties。')
    }
}
